<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Language Learning</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #333;
        }

        /* Navbar */
        .navbar {
            background: #4f46e5;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 24px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        /* Form Card */
        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #4f46e5;
            text-align: center;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #4f46e5;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
        }

        .btn-primary:hover {
            background: #3730a3;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        /* Footer */
        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .navbar {
                padding: 15px;
                flex-direction: column;
                gap: 12px;
            }

            .navbar a {
                margin-left: 10px;
            }

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <h1>🌍 Language Learning</h1>

        <div>
            <a href="/">Home</a>
            <a href="/students">Students</a>
            <a href="/add_student">Add Student</a>
        </div>

    </nav>


    <!-- Main Content -->
    <div class="container">

        <div class="form-card">

            <h2>✏️ Edit Student</h2>

            <p class="description">
                Update the student's information and learning progress.
            </p>


            <!-- Edit Student Form -->
            <form action="/edit_student/{{ student.id }}" method="POST">

                <!-- Student Name -->
                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ student.name }}"
                        placeholder="Enter student name"
                        required>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ student.email }}"
                        placeholder="Enter email address"
                        required>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password">

                    <small style="color:#777;">
                        Leave blank if you do not want to change the password.
                    </small>

                </div>


                <!-- Language -->
                <div class="form-group">

                    <label for="language">
                        Select Language
                    </label>

                    <select
                        id="language"
                        name="language"
                        required>

                        <option value="">
                            -- Select Language --
                        </option>

                        <option value="English"
                            {% if student.language == 'English' %}selected{% endif %}>
                            🇬🇧 English
                        </option>

                        <option value="Spanish"
                            {% if student.language == 'Spanish' %}selected{% endif %}>
                            🇪🇸 Spanish
                        </option>

                        <option value="French"
                            {% if student.language == 'French' %}selected{% endif %}>
                            🇫🇷 French
                        </option>

                        <option value="German"
                            {% if student.language == 'German' %}selected{% endif %}>
                            🇩🇪 German
                        </option>

                        <option value="Hindi"
                            {% if student.language == 'Hindi' %}selected{% endif %}>
                            🇮🇳 Hindi
                        </option>

                        <option value="Bengali"
                            {% if student.language == 'Bengali' %}selected{% endif %}>
                            🇮🇳 Bengali
                        </option>

                    </select>

                </div>


                <!-- Level -->
                <div class="form-group">

                    <label for="level">
                        Learning Level
                    </label>

                    <select
                        id="level"
                        name="level"
                        required>

                        <option value="">
                            -- Select Level --
                        </option>

                        <option value="Beginner"
                            {% if student.level == 'Beginner' %}selected{% endif %}>
                            Beginner
                        </option>

                        <option value="Intermediate"
                            {% if student.level == 'Intermediate' %}selected{% endif %}>
                            Intermediate
                        </option>

                        <option value="Advanced"
                            {% if student.level == 'Advanced' %}selected{% endif %}>
                            Advanced
                        </option>

                    </select>

                </div>


                <!-- Learning Goal -->
                <div class="form-group">

                    <label for="goal">
                        Learning Goal
                    </label>

                    <textarea
                        id="goal"
                        name="goal"
                        placeholder="Enter student's learning goal">{{ student.goal }}</textarea>

                </div>


                <!-- Buttons -->
                <div class="buttons">

                    <a
                        href="/"
                        class="btn btn-secondary">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary">
                        💾 Update Student
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Language Learning System |
            Learn • Practice • Improve
        </p>

    </footer>

</body>
</html>
